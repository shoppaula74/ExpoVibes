<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>

*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1,h2,.btn,nav button,.mb,strong{font-family:Fredoka,"DM Sans",system-ui,sans-serif}
header{position:relative;overflow:hidden;color:#fff;padding:34px 20px 40px;background:linear-gradient(120deg,#e0356b,#6d3fe0 55%,#0891b2)}
header:before,header:after{content:"";position:absolute;border-radius:50%;opacity:.25;background:#ffd166}
header:before{width:180px;height:180px;right:-40px;top:-60px}header:after{width:110px;height:110px;right:90px;bottom:-50px;background:#7bffd4}
.hw{position:relative;max-width:860px;margin:0 auto}
h1{font-size:2.6rem;font-weight:700;margin:0;line-height:1.1}
header p{margin:6px 0 0;max-width:520px;opacity:.95}

.lead{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--bd);border-top:6px solid var(--mc);border-radius:18px;padding:18px;margin:14px 0}
.media{display:grid;gap:10px;margin:12px 0}
.mi{display:flex;gap:12px;background:var(--card);border:2px dashed var(--mc);border-radius:18px;padding:14px}
.ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--mc);display:grid;place-items:center;font-size:1.6rem}
.mt{min-width:0}.mt img{display:block;max-width:100%;border-radius:12px;margin:8px 0}
.mb{display:inline-block;background:var(--mc);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600;text-decoration:none;margin-top:8px}
.mb.soon{background:var(--bd);color:var(--mut)}
.mt details{margin-top:8px}.mt summary{cursor:pointer;color:var(--mc);font-weight:600}.mt p{white-space:pre-line;margin:6px 0 0}
label{display:block;font-weight:700;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:9px 12px}
input:focus,textarea:focus{border-color:var(--mc)}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--mc);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn.alt{background:transparent;color:var(--mc);border:2px solid var(--mc)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}

.out.warn{border-color:var(--warn)}.out.bad{border-color:var(--bad)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:8px 0}
.chk input{width:auto;margin-top:6px;accent-color:var(--mc)}
input[type=range]{accent-color:var(--mc);padding:0}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--mc)}
.bar{height:12px;border-radius:99px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--mc)}

.note{font-size:.85rem;color:var(--mut)}
@media(max-width:520px){h1{font-size:2rem}}
@media(prefers-reduced-motion:reduce){.breath{transition:none}}
.row4{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:6px}.x{border:2px solid var(--bd);background:var(--bg);color:var(--bad);border-radius:12px;padding:0 12px;cursor:pointer;font-size:1rem}ul{padding-left:20px;margin:8px 0 0}li{margin:4px 0}.card .opt b{font-family:Fredoka,sans-serif}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.b{text-align:center;border:2px solid var(--bd);border-radius:14px;padding:8px 4px;opacity:.45;filter:grayscale(1)}.b.on{opacity:1;filter:none;border-color:var(--mc)}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font:600 15px Fredoka,sans-serif;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1}
</style>

<body>
<header><div class="hw"><button onclick="tgl()" aria-label="Cambiar entre tema claro y oscuro" style="position:absolute;right:0;top:-14px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:1rem">🌓</button><h1>ExpoVibes ✨</h1>
<p>Tu compañero digital para vivir Expopaz: equipo, tiempos, presupuesto y bienestar en un solo lugar.</p></div></header>
<nav id="nav" role="tablist" aria-label="Módulos"></nav>
<main id="main"></main>

<script>
/* ============ CONFIGURACIÓN ============
   Cada módulo admite una lista de recursos (o ninguna). Formato:
   {tipo:"video"|"archivo"|"imagen"|"enlace", t:"Título", d:"Descripción", url:"https://...", g:"guion opcional"}
   - video: enlace de YouTube, Vimeo o Drive (abre en pestaña nueva)
   - archivo: PDF, Word, etc. por enlace (Drive, Dropbox...)
   - imagen: enlace, o imagen incrustada en la página (data:image/...)
   Mientras url esté vacía, aparece "Próximamente". */
var MEDIA = {
  bienvenida:[{tipo:"video",t:"Bienvenida a Expopaz",d:"Video creado por las estudiantes de la intervención, junto a estudiantes, profesores y monitores de Expopaz.",url:""}],
  equipo:[],roles:[],conflicto:[],plan:[],presu:[],termo:[],habil:[],apoyo:[]
};
/* Completa estos datos con los reales */
var CONTACTOS = [
  {n:"Tutor académico / docente de tu grupo",d:"Primer paso ante problemas del proyecto o del equipo.",c:"[Completar]"},
  {n:"Centro de Servicios de Psicología",d:"Acompañamiento psicológico de la universidad.",c:"[Completar teléfono o enlace]"},
  {n:"Línea Amiga",d:"Apoyo emocional cuando lo necesites.",c:"[Completar número]"}
];

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ICO={video:"🎬",archivo:"📄",imagen:"🖼️",enlace:"🔗"},ACT={video:"Ver video",archivo:"Abrir archivo",imagen:"Ver imagen",enlace:"Abrir enlace"};
function vid(k){
  var l=MEDIA[k]||[];if(!l.length)return '';
  return '<div class="media">'+l.map(function(m){
    var inl=m.tipo==='imagen'&&/^data:image\//.test(m.url||''),
    b=m.url?(inl?'':'<a class="mb" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+ACT[m.tipo]+'</a>'):'<span class="mb soon">Próximamente</span>';
    return '<div class="mi"><div class="ic">'+ICO[m.tipo]+'</div><div class="mt"><strong>'+esc(m.t)+'</strong>'+(m.d?'<div class="note">'+esc(m.d)+'</div>':'')+(inl?'<img src="'+esc(m.url)+'" alt="'+esc(m.t)+'">':'')+b+(m.g?'<details><summary>Leer el guion</summary><p>'+esc(m.g)+'</p></details>':'')+'</div></div>'}).join('')+'</div>';
}
function out(id,txt,cls){var e=$('#'+id);e.className='out '+(cls||'');e.textContent=txt;e.hidden=false}

/* ---------- Módulos ---------- */
var REAL=[
 ["Voy a manejar Expopaz a la vez que mis otras materias.","Revisa el Planificador de tiempos."],
 ["Voy a trabajar con comunidades reales, lo que exige sensibilidad y adaptación.","Mira Habilidades blandas."],
 ["Es normal que haya tensiones en el equipo, sobre todo al implementar.","Haz el Acuerdo de equipo y el test de Roles."],
 ["Habrá costos de stand, impresiones y materiales.","Usa el Presupuesto."],
 ["La fase de implementación suele ser la más retadora.","Planea con holgura y cuida tu bienestar."],
 ["Pedir ayuda a tiempo es lo esperado, no una debilidad.","Consulta Rutas de apoyo."]
];
var QR=[
 ["Cuando el equipo empieza un trabajo nuevo, yo...",["Propongo un plan y reparto tareas","Me pongo a hacer lo que toca ya","Lanzo ideas distintas","Pregunto cómo se siente cada quien"]],
 ["Si se acerca una entrega, yo...",["Organizo y reviso el avance de todos","Me concentro y termino mi parte","Busco una forma más original de presentarlo","Ayudo a quien va más atrasado"]],
 ["En una discusión del grupo, suelo...",["Tomar la decisión","Pedir que dejemos de debatir y avancemos","Proponer una salida creativa","Calmar los ánimos"]],
 ["Lo que más disfruto del proyecto es...",["Coordinar","Ver cosas terminadas","Diseñar y comunicar","El ambiente del equipo"]]
];
var ROL=["Líder","Ejecutor","Creativo","Cuidador del equipo"];
var ROLD=[
 "Organizas y empujas al grupo. Cuida no cargar con todo y deja espacio para que otros decidan.",
 "Haces que las cosas pasen. Avisa pronto si te sobrecargas y pide que el reparto sea claro.",
 "Aportas ideas y estética. Acuerda fechas concretas para que las ideas lleguen a la entrega.",
 "Notas cómo está la gente y sostienes el clima. Recuerda cuidarte tú también."
];
var PASOS=[
 ["1. Frena y nombra lo que pasa","Antes de reaccionar, escribe qué ocurrió y cómo te sientes. Separa los hechos de las suposiciones."],
 ["2. Habla con el equipo, sin juicios","Elige un momento tranquilo. Usa frases como: \"Me preocupa que la entrega esté cerca y no tengo claro quién hace qué\". Habla de lo que ves y de lo que necesitas."],
 ["3. Revisen el acuerdo de equipo","Vuelvan a las metas y compromisos que firmaron. Ajusten el reparto si hace falta."],
 ["4. Si no se resuelve, acude al tutor o docente","Sigue el conducto regular. Lleva hechos concretos y propuestas, no solo quejas."],
 ["5. Pide apoyo si te desborda","Si sientes que el estrés pasa de lo manejable, ve a Rutas de apoyo. Pedir ayuda a tiempo funciona."]
];
var TIPS=[
 ["Ensaya en voz alta","Practica la sustentación completa al menos tres veces, de pie y con el tiempo medido."],
 ["Reparte las voces","Que cada integrante domine una parte y conozca el resto. Los jurados preguntan a cualquiera."],
 ["Prepara las primeras frases","Los nervios bajan cuando las dos primeras frases ya son automáticas."]
];
var TERM=[["Dormí lo suficiente esta semana",1],["Siento que la carga académica es manejable",1],["Mi ánimo general ha sido estable",1],["Siento que puedo contar con mi equipo",1],["Tengo tiempo para descansar y para mí",1]];

var M=[
{id:"bienvenida",t:"Bienvenida",e:"👋",c:"#e0356b",h:function(){
 return '<h2>Bienvenida a Expopaz</h2><p class="lead">Conoce qué es Expopaz y revisa qué tan alineadas están tus expectativas con lo que vas a vivir.</p>'+vid('bienvenida')+
 '<div class="card"><strong>Marca lo que ya tenías en cuenta</strong>'+REAL.map(function(r,i){return '<label class="chk"><input type="checkbox" class="exp" data-i="'+i+'"><span>'+r[0]+'</span></label>'}).join('')+
 '<button class="btn" onclick="checkExp()">Ver mi resultado</button><div id="o-exp" class="out" hidden></div></div>'}},
{id:"equipo",t:"Acuerdo de equipo",e:"🤝",c:"#6d3fe0",h:function(){
 var m='';for(var i=1;i<=5;i++)m+='<div class="row3"><input placeholder="Integrante '+i+'" class="mn"><input placeholder="Compromiso" class="mc"></div>';
 return '<h2>Acuerdo de equipo</h2><p class="lead">Conversen y llénenlo juntos antes de empezar. Después copien el resumen.</p>'+vid('equipo')+
 '<div class="card"><label>Nombre del equipo y del proyecto</label><input id="a-n">'+
 '<label>Meta a corto plazo (próximas semanas)</label><textarea id="a-c"></textarea>'+
 '<label>Meta a largo plazo (el día de la feria)</label><textarea id="a-l"></textarea>'+
 '<label>Compromisos individuales</label>'+m+
 '<label>Normas de convivencia (horarios, comunicación, qué hacer si alguien no cumple)</label><textarea id="a-r"></textarea>'+
 '<button class="btn" onclick="genAcuerdo()">Generar resumen</button><div id="o-ac" class="out" hidden></div>'+
 '<button class="btn alt" onclick="copiar(\'o-ac\')">Copiar</button></div>'}},
{id:"roles",t:"Roles",e:"🎭",c:"#0891b2",h:function(){
 return '<h2>¿Cómo trabajas en equipo?</h2><p class="lead">No hay roles mejores que otros. Sirve para conversar con tu grupo.</p>'+vid('roles')+'<div class="card" id="q"></div>'}},
{id:"conflicto",t:"Conflictos",e:"🧩",c:"#d9631c",h:function(){
 return '<h2>Cuando hay un conflicto</h2><p class="lead">Las tensiones son normales, sobre todo al implementar. Esta es una ruta para manejarlas.</p>'+vid('conflicto')+
 '<div class="card">'+PASOS.map(function(p){return '<details class="st"><summary>'+p[0]+'</summary><p>'+p[1]+'</p></details>'}).join('')+'</div>'}},
{id:"plan",t:"Tiempos",e:"🗓️",c:"#2563eb",h:function(){
 return '<h2>Planificador de tiempos</h2><p class="lead">Divide el proyecto en fases y detecta cruces con tus otras entregas.</p>'+vid('plan')+
 '<div class="card"><label>¿Cuántas semanas tienen hasta la feria?</label><input id="p-s" type="number" min="3" max="30" value="12">'+
 '<label>Semanas en que tienen entregas de otras materias (separadas por coma)</label><input id="p-o" placeholder="Ej: 5, 9, 10">'+
 '<button class="btn" onclick="plan()">Calcular fases</button><div id="o-p" class="out" hidden></div></div>'}},
{id:"presu",t:"Presupuesto",e:"💰",c:"#12946f",h:function(){
 return '<h2>Presupuesto del stand</h2><p class="lead">Calculen antes cuánto cuesta y cómo se reparte.</p>'+vid('presu')+
 '<div class="card" id="pr"><div class="note">Concepto y valor en pesos</div></div>'+
 '<div class="card"><label>Número de integrantes</label><input id="pr-n" type="number" min="1" value="4">'+
 '<button class="btn alt" onclick="addRow()">Agregar gasto</button> <button class="btn" onclick="calc()">Calcular</button><div id="o-pr" class="out" hidden></div></div>'}},
{id:"termo",t:"Bienestar",e:"🌡️",c:"#dc4a4a",h:function(){
 return '<h2>Termómetro de bienestar</h2><p class="lead">Un chequeo rápido para ti. Es orientativo, no un diagnóstico, y no se guarda en ningún lado.</p>'+vid('termo')+
 '<div class="card">'+TERM.map(function(t,i){return '<label for="t'+i+'">'+t[0]+'</label><input id="t'+i+'" class="tr" type="range" min="1" max="5" value="3"><div class="note">1 = nada, 5 = totalmente</div>'}).join('')+
 '<button class="btn" onclick="termo()">Ver resultado</button><div id="o-t" class="out" hidden></div></div>'}},
{id:"habil",t:"Habilidades",e:"🎤",c:"#8a43d6",h:function(){
 return '<h2>Habilidades blandas</h2><p class="lead">Respira antes de sustentar y prepárate con tres ideas simples.</p>'+vid('habil')+
 '<div class="card" style="text-align:center"><strong>Respiración 4-4</strong><div class="breath" id="br" aria-live="polite">Listo</div>'+
 '<button class="btn" id="brb" onclick="breath()">Empezar</button></div>'+
 TIPS.map(function(t){return '<div class="card"><strong>'+t[0]+'</strong><p style="margin:4px 0 0">'+t[1]+'</p></div>'}).join('')}},
{id:"apoyo",t:"Rutas de apoyo",e:"💛",c:"#b86e00",h:function(){
 return '<h2>Rutas de apoyo</h2><p class="lead">Pedir ayuda a tiempo es parte del proceso, no una señal de debilidad.</p>'+vid('apoyo')+
 CONTACTOS.map(function(c){return '<div class="card"><strong>'+esc(c.n)+'</strong><p style="margin:4px 0">'+esc(c.d)+'</p><div class="note">Contacto: '+esc(c.c)+'</div></div>'}).join('')+
 '<div class="card" style="border-color:var(--bad)"><strong>Si estás en peligro inmediato</strong><p style="margin:4px 0 0">Llama a la línea de emergencias 123 o acude a alguien de confianza que esté cerca.</p></div>'}}
];

/* ===== AMPLIACIÓN ===== */
function ld(k,d){try{var v=localStorage.getItem('ev_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem('ev_'+k,JSON.stringify(v))}catch(e){}}
function copiar2(t,m){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert(m||'Copiado')},function(){alert('No se pudo copiar')});else alert('No se pudo copiar')}
var CORREO=""; /* Correo del equipo para recibir ideas (opcional) */
MEDIA.resil=[{tipo:"video",t:"Charla que inspira",d:"Una charla tipo TED sobre resiliencia o trabajo en equipo, elegida por el equipo del proyecto.",url:""}];
function setH(id,f){M.filter(function(m){return m.id===id})[0].h=f}
function wrap(id,f){var m=M.filter(function(x){return x.id===id})[0],o=m.h;m.h=function(){return f(o())}}
function ins(after,o){var i=0;M.forEach(function(m,j){if(m.id===after)i=j+1});M.splice(i,0,o)}
function card(t,b){return '<div class="card"><strong>'+t+'</strong>'+b+'</div>'}

/* Bienvenida: mapa de Expopaz */
wrap('bienvenida',function(h){
 var mapa=card('Mapa de Expopaz','<p class="note">Tres fases. La del medio suele ser la más retadora.</p>'+
 [["Diseño y acuerdos","Conforman el equipo, definen metas, reparten compromisos y proyectan tiempos y presupuesto."],["Implementación","Salen a las comunidades y construyen su PASC (producto de apropiación social del conocimiento). Aquí surgen más tensiones y cansancio."],["Consolidación y feria","Cierran el trabajo escrito, montan el stand y sustentan. Coincide con el cierre del semestre."]].map(function(f,i){return '<details class="st"><summary>Fase '+(i+1)+': '+f[0]+'</summary><p>'+f[1]+'</p></details>'}).join(''))+
 card('Quién te acompaña','<p><b>Estudiantes:</b> desarrollan la investigación y la acción social con su equipo.<br><b>Profesores:</b> orientan, evalúan y pueden activar flexibilizaciones y rutas de salud mental.<br><b>Monitores:</b> conectan a estudiantes, docentes y feria, y te orientan a tiempo.</p>')+
 card('Preguntas frecuentes','<details class="st"><summary>¿Es normal sentirme estresado/a?</summary><p>Sí. Los docentes reconocen que Expopaz mezcla orgullo y frustración, y que el estrés sube hacia el cierre del semestre. Lo importante es anticiparlo y pedir ayuda a tiempo.</p></details><details class="st"><summary>¿Qué hago si mi equipo no funciona?</summary><p>Revisa el módulo de Conflictos: primero hablar en el equipo, luego el tutor o docente.</p></details><details class="st"><summary>¿Y si me desbordo?</summary><p>Habla con tu docente o ve a Rutas de apoyo. No tienes que esperar a que sea grave.</p></details>');
 return h.replace('<div class="card">',mapa+'<div class="card">')});

/* Roles: más preguntas y mezcla de equipo */
QR=[["Cuando el equipo empieza un trabajo nuevo, yo...",["Propongo un plan y reparto tareas","Me pongo a hacer lo que toca ya","Lanzo ideas distintas","Pregunto cómo se siente cada quien"]],
["Si se acerca una entrega, yo...",["Organizo y reviso el avance de todos","Me concentro y termino mi parte","Busco una forma más original de presentarlo","Ayudo a quien va más atrasado"]],
["En una discusión del grupo, suelo...",["Tomar la decisión","Pedir que avancemos y dejemos de debatir","Proponer una salida creativa","Calmar los ánimos"]],
["Lo que más disfruto del proyecto es...",["Coordinar","Ver cosas terminadas","Diseñar y comunicar","El ambiente del equipo"]],
["Al planear el stand de Expopaz, primero...",["Defino responsables y fechas","Cotizo y consigo los materiales","Imagino cómo se verá y qué sentirán los visitantes","Pregunto qué necesita cada integrante"]],
["Cuando hay que hablar con la comunidad...",["Dirijo la conversación","Me aseguro de que la logística funcione","Busco una forma cercana y creativa de conectar","Escucho y noto cómo se sienten"]],
["Si alguien del equipo no cumple...",["Le pido cuentas directamente","Asumo parte de su tarea para no atrasarnos","Propongo otra forma de repartir el trabajo","Hablo con esa persona para entender qué le pasa"]],
["Mi mayor aporte en las reuniones es...",["Dar dirección","Hacer seguimiento a lo acordado","Ideas nuevas","Mantener un buen ambiente"]],

wrap('bienvenida',function(h){return h.replace('</p>','</p>'+card('¿Qué es Expopaz?','<p style="font-size:1.1rem"><b>Expopaz es la apuesta de la Facultad de Ciencias del Comportamiento de la Universidad de La Sabana por una pregunta grande: ¿cómo puede lo que aprendes en el aula ayudar a construir una sociedad más justa y en paz?</b></p><p>Durante un año, estudiantes como tú se acercan a problemáticas sociales reales, escuchan a las comunidades y crean un <b>PASC</b> (producto de apropiación social del conocimiento): una forma de devolverle a la sociedad lo que la investigación descubre. Cada proyecto es una pequeña contribución a la justicia social y al desarrollo sostenible.</p><p>La feria es el punto de encuentro: un «collage de iniciativas» donde estudiantes, docentes y comunidades se escuchan, conversan y celebran lo construido.</p><ul><li><b>Nació de la paz:</b> en 2022-2, con la pregunta de cómo convertir el informe final de la Comisión de la Verdad en productos de apropiación social del conocimiento. La primera feria fue en 2023-1.</li><li><b>Ha crecido:</b> sumó nuevas líneas temáticas y en 2024 se vinculó al Semillero de Investigación en Interacción Humana. Llegó al encuentro de la International Society of Political Psychology, en Santiago de Chile, y se publicó en el libro del Premio ASCOFAPSI a la Innovación Docente, como una apuesta por el desarrollo sostenible.</li><li><b>Te deja más que un producto:</b> resiliencia, tolerancia a la frustración, trabajo en equipo y la posibilidad de ver cómo tu investigación aporta a la sociedad.</li></ul>'))});

var cur=0;
function show(i){
 cur=i;var mo=M[i];$('#main').style.setProperty('--mc',mo.c);$('#main').innerHTML=mo.h().replace('<h2>','<h2><span class="em">'+mo.e+'</span> ');
 [].forEach.call(document.querySelectorAll('#nav button'),function(b,j){b.setAttribute('aria-selected',j===i)});
 if(M[i].id==='roles')quiz();
 if(M[i].id==='presu')presuInit();if(M[i].id==='ideas')ideasRender();if(pT){clearInterval(pT);pT=null}if(M[i].id==='asert')simStart();if(M[i].id==='resil'){charlasRender();riskInit();retroRender()}
 window.scrollTo(0,0);
}

/* Lógica */
function checkExp(){
 var pend=[];[].forEach.call(document.querySelectorAll('.exp'),function(c){if(!c.checked)pend.push(REAL[c.dataset.i])});
 if(!pend.length){out('o-exp','Vas muy alineado con lo que implica Expopaz. Usa los otros módulos para planear con tu equipo.');return}
 out('o-exp','Te faltan por considerar '+pend.length+' de 6:\n\n'+pend.map(function(p){return '• '+p[0]+'\n  '+p[1]}).join('\n\n'),'warn');
}
function genAcuerdo(){
 var g=function(i){return $('#'+i).value.trim()||'(pendiente)'},ms=[].map.call(document.querySelectorAll('.mn'),function(n,i){var c=document.querySelectorAll('.mc')[i].value.trim();return n.value.trim()?'- '+n.value.trim()+': '+(c||'(pendiente)'):''}).filter(Boolean).join('\n');
 out('o-ac','ACUERDO DE EQUIPO: '+g('a-n')+'\n\nMeta a corto plazo:\n'+g('a-c')+'\n\nMeta a largo plazo:\n'+g('a-l')+'\n\nCompromisos:\n'+(ms||'(pendiente)')+'\n\nNormas de convivencia:\n'+g('a-r'));
}
function copiar(id){var t=$('#'+id).textContent;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert('Copiado')},function(){alert('Selecciona el texto y cópialo manualmente')});else alert('Selecciona el texto y cópialo manualmente')}
var qa=[],qi=0;
function quiz(){qa=[0,0,0,0];qi=0;qstep()}
function qstep(){
 var q=QR[qi];$('#q').innerHTML='<div class="note">Pregunta '+(qi+1)+' de '+QR.length+'</div><div class="bar"><i style="width:'+(qi/QR.length*100)+'%"></i></div><p><strong>'+q[0]+'</strong></p>'+q[1].map(function(o,i){return '<button class="opt" onclick="qpick('+i+')">'+o+'</button>'}).join('');
}
function plan(){
 var n=Math.max(3,parseInt($('#p-s').value)||12),a=Math.max(1,Math.round(n*.3)),b=Math.max(a+1,Math.round(n*.75)),
 ov=$('#p-o').value.split(',').map(function(x){return parseInt(x)}).filter(function(x){return x>0&&x<=n}),
 t='Diseño y acuerdos: semanas 1 a '+a+'\nImplementación (la más retadora): semanas '+(a+1)+' a '+b+'\nConsolidación y feria: semanas '+(b+1)+' a '+n;
 var c=ov.filter(function(x){return x>a&&x<=b}),cls='';
 if(c.length){t+='\n\nAtención: las semanas '+c.join(', ')+' de otras materias caen en implementación. Adelanten tareas antes de esas semanas y dejen holgura.';cls='warn'}
 else if(ov.length)t+='\n\nTus otras entregas no coinciden con implementación. Aun así, dejen una semana de colchón.';
 out('o-p',t,cls);
}
var rows=0;
function addRow(n){rows++;var d=document.createElement('div');d.className='row3';d.innerHTML='<input placeholder="Concepto" value="'+esc(n||'')+'" class="pc"><input type="number" min="0" placeholder="$" class="pv">';$('#pr').appendChild(d)}
function calc(){
 var t=0;[].forEach.call(document.querySelectorAll('.pv'),function(v){t+=parseFloat(v.value)||0});
 var n=Math.max(1,parseInt($('#pr-n').value)||1),f=function(x){return '$'+Math.round(x).toLocaleString('es-CO')};
 out('o-pr','Total: '+f(t)+'\nPor integrante ('+n+'): '+f(t/n)+'\n\nSugerencia: sumen un 10% de imprevistos ('+f(t*1.1)+' en total).');
}
function termo(){
 var s=0;[].forEach.call(document.querySelectorAll('.tr'),function(r){s+=parseInt(r.value)});
 if(s>=19)out('o-t','Vas bien. Sigue cuidando tu sueño y tus pausas, y revisa de nuevo en unas semanas.');
 else if(s>=13)out('o-t','Hay señales de desgaste. Reorganiza tus tareas con el Planificador, habla con tu equipo y reserva tiempo de descanso. Si esto se mantiene, mira las Rutas de apoyo.','warn');
 else out('o-t','Estás cargando mucho. No tienes que resolverlo solo: habla hoy con alguien de confianza, con tu tutor o con el Centro de Servicios de Psicología. Revisa las Rutas de apoyo.','bad');
}
var bt;
function breath(){
 var el=$('#br'),btn=$('#brb');if(bt){clearInterval(bt);bt=null;el.style.transform='';el.textContent='Listo';btn.textContent='Empezar';return}
 var up=false,n=0;btn.textContent='Detener';
 function step(){up=!up;el.style.transform=up?'scale(1.6)':'scale(1)';el.textContent=up?'Inhala':'Exhala';if(++n>12)breath()}
 step();bt=setInterval(step,4000);
}
show(0);
