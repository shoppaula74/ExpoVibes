 ['4. Para qué los usamos (finalidades)',['• Crear tu perfil y guardar tu avance.','• Que docentes y monitores acompañen el proceso y revisen las entregas por semana y por equipo.','• Compartir el calendario y las evidencias dentro de tu equipo.','• Recoger ideas en el foro para mejorar el próximo Expopaz.','• Elaborar reportes de mejora sin identificarte.','• Conservar la prueba de tu autorización, como exige la ley.','No vendemos tus datos, no los usamos para publicidad y no hacemos perfiles comerciales.']],

 ['6. Proveedores y transmisión internacional',['La página se aloja en la plataforma de Anthropic (claude.ai), que actúa como proveedor tecnológico (encargado). Sus servidores pueden estar fuera de Colombia, por ejemplo en Estados Unidos, país que la Superintendencia de Industria y Comercio incluye entre los de nivel adecuado de protección (Circular Externa 005 de 2017). Las fuentes tipográficas se cargan desde Google Fonts.','Si usas el análisis profundo opcional de mensajes, el texto de ese mensaje se envía a Claude solo cuando pulsas el botón y aceptas el permiso que te muestra la plataforma.']],
 ['7. Tus derechos',['Según el artículo 8 de la Ley 1581 puedes:','• Conocer, actualizar y rectificar tus datos.','• Pedir prueba de la autorización que diste.','• Que te informemos cómo se han usado tus datos.','• Presentar quejas ante la Superintendencia de Industria y Comercio (SIC).','• Revocar tu autorización y pedir que borremos tus datos, salvo que exista un deber legal de conservarlos (por ejemplo, la prueba de tu autorización).','• Acceder gratis a tus datos.','Cómo ejercerlos: en Mi espacio puedes ver, corregir, copiar y borrar tus datos. También puedes escribir a '+cEmail()+'. Respondemos las consultas en máximo 10 días hábiles (prorrogables 5) y los reclamos en máximo 15 días hábiles (prorrogables 8).']],
 ['8. Cuánto tiempo los guardamos',['Guardamos tus datos '+CONF.retencion+'. Después los eliminamos o los anonimizamos. Conservamos solo la prueba de aceptación o revocación, sin tus respuestas, por el tiempo necesario para demostrar el cumplimiento de la ley.']],
 ['9. Seguridad',['Cada estudiante solo puede leer su propio registro. Guardamos lo mínimo necesario y comprimimos las fotos. Ningún sistema es totalmente seguro: evita subir información que no quieras compartir con el equipo docente.']],
 ['10. Menores de edad',['La página es para personas mayores de 18 años. La ley prohíbe tratar datos de menores salvo excepciones (Decreto 1377 de 2013, art. 12).']],
 ['11. Autoridad de protección de datos',['Superintendencia de Industria y Comercio (SIC) · Delegatura para la Protección de Datos Personales · www.sic.gov.co.']],

 '<div class="card" style="border-color:var(--bad)"><strong>Si estás en peligro inmediato</strong><p style="margin:4px 0 0">Llama a la línea de emergencias 123 o acude a alguien de confianza que esté cerca.</p></div>'}});

/* ============ PANEL DEL EQUIPO DOCENTE (solo editores) + ARRANQUE ============ */
var PN={rows:[],cons:{},sem:'',loaded:false,sel:null};
function pnLoad(){var el=$('#pn-b');if(!el)return;if(MODE!=='srv'||!ISED){el.innerHTML='<div class="out warn">Este panel solo funciona cuando abres la página con una cuenta con permiso de editor. Mira abajo cómo dar acceso.</div>';return}
 el.innerHTML='<p class="note">Cargando...</p>';
 Promise.all([DB.collection('estudiantes').get(),DB.collection('consentimientos').get()]).then(function(r){PN.rows=[];r[0].docs.forEach(function(d){var x=d.data();x.id=d.id;PN.rows.push(x)});PN.cons={};r[1].docs.forEach(function(d){PN.cons[d.id]=d.data()});PN.loaded=true;pnDraw()},function(){el.innerHTML='<div class="out bad">No se pudieron leer los datos. Puede que tu cuenta no tenga nivel de editor.</div>'})}
function pnSem(){return PN.sem||CONF.sem}
function pnDraw(){var el=$('#pn-b');if(!el)return;var sems=CONF.semestres.slice();PN.rows.forEach(function(r){if(sems.indexOf(r.sem)<0&&r.sem)sems.push(r.sem)});
 var rows=PN.rows.filter(function(r){return (r.sem||'')===pnSem()&&r.perfil}),teams={};rows.forEach(function(r){var k=(r.perfil.p||'Sin proyecto').trim();(teams[k]=teams[k]||[]).push(r)});
 var h='<label for="pn-s">Semestre</label><select id="pn-s" onchange="PN.sem=this.value;pnDraw()">'+sems.map(function(s){return '<option'+(s===pnSem()?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select><div class="mv" style="margin:8px 0"><button class="btn sm" style="margin:0" onclick="pnLoad()">↻ Actualizar</button><button class="btn alt sm" style="margin:0" onclick="pnCsv()">Descargar CSV</button><button class="btn alt sm" style="margin:0" onclick="pnCopy()">Copiar resumen</button></div><p class="note">'+rows.length+' estudiantes en '+Object.keys(teams).length+' proyectos.</p>';
 h+=Object.keys(teams).sort().map(function(t){return '<details class="st"><summary><b>'+esc(t)+'</b> · '+teams[t].length+' persona(s)</summary>'+teams[t].map(function(r){var c=PN.cons[r.id],ok=c&&c.ev&&c.ev.length,k=r.k||{},lg=(k.log||[]).length;
  return '<div class="card plain" style="margin:8px 0"><div class="mv">'+avH(r.perfil.av,30)+' <b>'+esc(r.perfil.n)+'</b></div><div class="note">Aceptación: '+(ok?'✓ '+fd(c.ev[c.ev.length-1].t)+' (v'+esc(c.ev[c.ev.length-1].v)+')':'sin registro')+' · '+lg+' respuestas · '+((k.bd||[]).length)+' insignias · actualizado '+(r.t?fd(r.t):'-')+'</div><button class="btn alt sm" style="margin:6px 0 0" onclick="pnOpen(\''+r.id+'\')">Ver respuestas por semana</button></div>'}).join('')+'</details>'}).join('')||'<p class="note">Aún no hay registros en este semestre.</p>';
 el.innerHTML=h+'<div id="pn-d"></div>'}
function pnOpen(id){var r=PN.rows.filter(function(x){return x.id===id})[0],k=r.k||{},lg=k.log||[],byW={};lg.forEach(function(x){var w=x.w||0;(byW[w]=byW[w]||[]).push(x)});
 var h='<div class="card" style="margin-top:12px"><strong>'+esc(r.perfil.n)+' · '+esc(r.perfil.p)+'</strong>'+Object.keys(byW).sort(function(a,b){return a-b}).map(function(w){return '<h3>'+(w>0?'Semana '+w:'Otras actividades')+'</h3>'+byW[w].map(function(x){return '<details class="st"><summary>'+esc(x.m)+' · <span class="note">'+fd(x.t)+'</span></summary><p style="white-space:pre-line">'+esc(x.x)+'</p></details>'}).join('')}).join('')||'<p class="note">Sin respuestas todavía.</p>';
 h+='<div id="pn-ph"></div><button class="btn alt sm" onclick="pnPhotos(\''+id+'\')">Ver fotos de evidencia</button></div>';$('#pn-d').innerHTML=h;$('#pn-d').scrollIntoView({behavior:'smooth',block:'start'})}
function pnPhotos(id){var el=$('#pn-ph');el.innerHTML='<p class="note">Cargando fotos...</p>';DB.collection('fotos/'+id+'/items').get().then(function(s){if(!s.docs.length){el.innerHTML='<p class="note">No hay fotos.</p>';return}
 el.innerHTML='<div class="ph">'+s.docs.map(function(d){var x=d.data();return '<figure style="margin:0"><img src="'+esc(x.d)+'" alt="Evidencia semana '+esc(x.w)+'" style="width:100%;border-radius:10px"><figcaption class="note">Semana '+esc(x.w)+(x.c?' · '+esc(x.c):'')+'</figcaption></figure>'}).join('')+'</div>'},function(){el.innerHTML='<p class="note">No se pudieron cargar.</p>'})}
function pnTxt(){var rows=PN.rows.filter(function(r){return (r.sem||'')===pnSem()&&r.perfil});return rows.map(function(r){return '== '+r.perfil.p+' · '+r.perfil.n+' ==\n'+((r.k||{}).log||[]).map(function(x){return '[S'+(x.w||'-')+'] '+x.m+': '+x.x}).join('\n')}).join('\n\n')}
function pnCopy(){copiar2(pnTxt(),'Resumen copiado')}
function pnCsv(){var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'},L=[['semestre','proyecto','nombre','semana','actividad','respuesta','fecha','aceptacion'].map(q).join(',')];
 PN.rows.filter(function(r){return (r.sem||'')===pnSem()&&r.perfil}).forEach(function(r){var c=PN.cons[r.id],a=c&&c.ev&&c.ev.length?c.ev[c.ev.length-1].t:'';((r.k||{}).log||[]).forEach(function(x){L.push([r.sem,r.perfil.p,r.perfil.n,x.w||'',x.m,x.x,x.t,a].map(q).join(','))})});
 var data='\ufeff'+L.join('\n');if(!(window.claude&&window.claude.use))return copiar2(data,'CSV copiado');claude.use('downloads').then(function(d){if(!d)return copiar2(data,'CSV copiado');return d.save({filename:'expovibes-'+pnSem()+'.csv',data:data})}).catch(function(){copiar2(data,'CSV copiado')})}
